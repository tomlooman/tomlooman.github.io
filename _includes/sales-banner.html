{% include sale-state.html %}

{% if sale_active %}
    <div id="sales-banner" class="sales-banner">
    <div class="sales-banner-inner">
        <p id="sales-banner-text">
        🎉 <strong>Indie Developer Sale:</strong>
        Save 25% on 
        <a href="https://tomlooman.com/courses/unrealengine-cpp/">UE5 C++</a>
        and 
        <a href="https://tomlooman.com/courses/unrealengine-optimization/">Game Optimization</a>
        courses with code <code>INDIESALE</code>.
        <br>Ends {{ site.data.sale.ends_at | date: "%B %-d at %H:%M" }} UTC.
        </p>
           <div
            id="sales-banner-timer"
            data-sale-end-date="{{ site.data.sale.ends_at | escape }}"
            >
            <span class="sales-countdown" role="timer" aria-live="off">
                Ends
                <time datetime="{{ site.data.sale.ends_at | escape }}">
                {{ site.data.sale.ends_at | date: "%B %-d at %H:%M" }} UTC
                </time>
            </span>
            </div>
    </div>
    <button id="sales-banner-close" aria-label="Close">x</button>
    </div>

    <script>
    (function () {
        const banner = document.getElementById("sales-banner");
        const timer = document.getElementById("sales-banner-timer");
        const close = document.getElementById("sales-banner-close");

        if (!banner) return;

        const STORAGE_KEY = "salesBannerClosedOn";
        const closedOn = localStorage.getItem(STORAGE_KEY);

        function getDayString(date) {
            return date.toISOString().slice(0, 10);
        }

        const today = getDayString(new Date());

        // If closed today → remove the whole banner instead of hide
        if (closedOn === today) {
            banner.remove();
            return;
        }

        // User manually closes it
        close?.addEventListener("click", () => {
            localStorage.setItem(STORAGE_KEY, today);
            banner.remove();
        });

        if (!timer) return;

        const saleEndDateUTC = new Date(timer.dataset.saleEndDate);
        if (Number.isFinite(saleEndDateUTC.getTime()) && Date.now() >= saleEndDateUTC.getTime()) 
        {
            banner.remove();
            return;
        }

    })();
    </script>

    <script>
    (() => {
    const timer = document.getElementById("sales-banner-timer");
    if (!timer) return;

    const output = timer.querySelector(".sales-countdown");
    const deadline = Date.parse(timer.dataset.saleEndDate);
    if (!Number.isFinite(deadline)) return;

    const pad = value => String(value).padStart(2, "0");

    function updateCountdown() {
        const remaining = Math.max(0, deadline - Date.now());
        const totalSeconds = Math.floor(remaining / 1000);

        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor(totalSeconds / 3600) % 24;
        const minutes = Math.floor(totalSeconds / 60) % 60;
        const seconds = totalSeconds % 60;

        output.textContent =
        `${pad(days)}D ${pad(hours)}H ${pad(minutes)}M ${pad(seconds)}S`;

        return remaining > 0;
    }

    if (updateCountdown()) {
        const interval = setInterval(() => {
        if (!updateCountdown()) clearInterval(interval);
        }, 1000);
    }
    })();
    </script>
{%endif%}
